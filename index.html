<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>校慶 30：光速腦力戰域</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            color: white;
            user-select: none;
        }
        canvas { display: block; }

        /* --- UI 層 --- */
        #hud {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        /* 頂部資訊列 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 15px 40px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .score-box {
            font-size: 4vw;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #p1-score-box { color: #00f3ff; text-shadow: 0 0 20px #00f3ff; }
        #p2-score-box { color: #ff0055; text-shadow: 0 0 20px #ff0055; }
        .player-label { font-size: 1.5vw; opacity: 0.8; }

        /* 遊戲時間倒數 */
        #timer-box {
            font-size: 5vw;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 5px 30px;
            border-radius: 0 0 20px 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: none;
            text-shadow: 0 0 10px white;
            min-width: 120px;
            text-align: center;
        }
        .timer-warning { color: #ff3333 !important; animation: pulse 0.5s infinite; }

        /* 題目顯示 (置中) */
        #question-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }
        #question-text {
            display: inline-block;
            font-size: 4vw;
            font-weight: bold;
            background: rgba(0,0,0,0.7);
            padding: 15px 60px;
            border-radius: 50px;
            border: 2px solid rgba(255,255,255,0.2);
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            transition: all 0.3s;
        }
        /* 撞球模式時題目移到上方 */
        .bumper-mode-q { top: 20% !important; transform: translate(-50%, 0) !important; }

        /* --- 生存模式倒數 (修改位置與大小) --- */
        #survival-countdown {
            position: absolute;
            top: 35%; /* 向上移，原為 50% */
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10vw; /* 縮小，原為 20vw */
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 0 30px #ffcc00;
            display: none;
            z-index: 20;
        }

        /* --- 遊戲覆蓋層 (開始/結束) --- */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 16, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .screen-content { text-align: center; width: 100%; }

        /* 結算佈局 */
        .result-container {
            display: flex;
            width: 90%; height: 85%;
            gap: 20px;
            margin: auto;
        }
        .result-col {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .result-p1 { border-color: #00f3ff; box-shadow: 0 0 20px rgba(0,243,255,0.2); }
        .result-p2 { border-color: #ff0055; box-shadow: 0 0 20px rgba(255,0,85,0.2); }
        .result-center { flex: 1.2; background: rgba(0,0,0,0.3); }

        h2 { margin: 0 0 20px 0; font-size: 2.5vw; text-transform: uppercase; }
        .big-score { font-size: 8vw; font-weight: 900; margin: auto; }
        
        .leaderboard-list {
            width: 100%; text-align: left; font-size: 1.2vw; color: #ccc;
            overflow-y: auto; max-height: 40vh;
        }
        .lb-item {
            display: flex; justify-content: space-between; padding: 8px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .lb-rank { width: 30px; font-weight: bold; color: #ffcc00; }
        .lb-name { flex: 1; text-align: center;}
        .lb-score { width: 60px; text-align: right; color: white; }

        input {
            background: transparent; border: 2px solid white; color: white;
            font-size: 2vw; padding: 5px; text-align: center; width: 200px;
            text-transform: uppercase; border-radius: 10px;
        }
        
        button {
            margin-top: 30px; padding: 15px 50px; font-size: 2vw;
            background: white; border: none; font-weight: bold; cursor: pointer;
            border-radius: 50px; box-shadow: 0 0 20px rgba(255,255,255,0.5);
            transition: all 0.2s; pointer-events: auto;
        }
        button:hover { transform: scale(1.1); box-shadow: 0 0 40px rgba(255,255,255,0.8); }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div class="top-bar">
            <div class="score-box" id="p1-score-box">
                <span class="player-label">P1 藍隊</span>
                <span id="p1-score">0</span>
            </div>
            <div id="timer-box">60</div>
            <div class="score-box" id="p2-score-box">
                <span class="player-label">P2 紅隊</span>
                <span id="p2-score">0</span>
            </div>
        </div>
        
        <div id="question-container" class="bumper-mode-q">
            <div id="question-text">準備開始...</div>
        </div>
        
        <div id="survival-countdown">5</div>
    </div>

    <!-- 覆蓋層 -->
    <div id="overlay">
        <!-- 開始畫面 -->
        <div id="start-screen" class="screen-content">
            <h1 style="font-size:5vw; color:white; text-shadow:0 0 30px #00f3ff; margin-bottom:10px;">
                校慶 30：光速腦力戰域
            </h1>
            <p style="font-size:1.5vw; color:#aaa; margin-bottom: 40px;">
                P1: <b>WASD</b> &nbsp;|&nbsp; P2: <b>方向鍵</b>
            </p>
            <p style="color:#ffcc00; font-size: 1.3vw; background: rgba(0,0,0,0.5); display:inline-block; padding:10px 20px; border-radius:20px;">
                ⭐ 撞球得分 +10 / 扣分 -1 <br>
                ⭐ 生存模式正確 +10
            </p>
            <br>
            <button id="start-btn">開始對戰 (60秒)</button>
        </div>

        <!-- 結束畫面 -->
        <div id="end-screen" class="result-container" style="display:none;">
            <div class="result-col result-p1">
                <h2>P1 藍隊</h2>
                <div class="big-score" id="end-p1-score">0</div>
                <div id="p1-win-msg" style="display:none; color:#00f3ff; font-weight:bold; font-size:3vw; margin-top:20px;">WINNER</div>
            </div>

            <div class="result-col result-center">
                <h2>TOP 10 排行榜</h2>
                <div class="leaderboard-list" id="lb-list"></div>
                
                <div id="winner-input-section" style="margin-top:20px; display:none;">
                    <p style="margin:5px;">恭喜獲勝！輸入名字：</p>
                    <input type="text" id="winner-name" maxlength="5" placeholder="NAME">
                    <br>
                    <button id="submit-score-btn" style="font-size: 1.5vw; padding: 10px 30px;">儲存</button>
                </div>
                <div id="replay-btn-section" style="display:none; text-align:center;">
                    <button id="replay-btn" style="font-size: 1.5vw; padding: 10px 30px;">再玩一次</button>
                </div>
            </div>

            <div class="result-col result-p2">
                <h2>P2 紅隊</h2>
                <div class="big-score" id="end-p2-score">0</div>
                <div id="p2-win-msg" style="display:none; color:#ff0055; font-weight:bold; font-size:3vw; margin-top:20px;">WINNER</div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 初始化 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI 綁定
        const ui = {
            timer: document.getElementById('timer-box'),
            qContainer: document.getElementById('question-container'),
            qText: document.getElementById('question-text'),
            p1Score: document.getElementById('p1-score'),
            p2Score: document.getElementById('p2-score'),
            survivalCnt: document.getElementById('survival-countdown'),
            overlay: document.getElementById('overlay'),
            startScreen: document.getElementById('start-screen'),
            endScreen: document.getElementById('end-screen'),
            endP1: document.getElementById('end-p1-score'),
            endP2: document.getElementById('end-p2-score'),
            inputSec: document.getElementById('winner-input-section'),
            replaySec: document.getElementById('replay-btn-section'),
            winnerInput: document.getElementById('winner-name'),
            lbList: document.getElementById('lb-list'),
            p1WinMsg: document.getElementById('p1-win-msg'),
            p2WinMsg: document.getElementById('p2-win-msg')
        };

        // 確保按鈕可點擊
        document.getElementById('start-btn').onclick = startGame;
        document.getElementById('submit-score-btn').onclick = submitScore;
        document.getElementById('replay-btn').onclick = () => location.reload();

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- 2. 遊戲狀態 ---
        let gameState = 'start'; 
        let gameTime = 60;
        let timerInterval = null;
        let specialEventTriggered = false; 
        let continuousScoreTimer = 0; // 用於 0.1秒 加分控制

        // 模式控制
        let currentMode = 'bumper'; 
        let survivalTimer = 0;
        const SURVIVAL_PREP_TIME = 5; // 修改：倒數改為 5 秒

        // 玩家
        const players = {
            p1: { x: 0, y: 0, r: 25, color: '#00f3ff', score: 0, vx: 0, vy: 0, keys: {u:'w', d:'s', l:'a', r:'d'} },
            p2: { x: 0, y: 0, r: 25, color: '#ff0055', score: 0, vx: 0, vy: 0, keys: {u:'ArrowUp', d:'ArrowDown', l:'ArrowLeft', r:'ArrowRight'} }
        };
        const keysPressed = {};
        window.addEventListener('keydown', (e) => keysPressed[e.key] = true);
        window.addEventListener('keyup', (e) => keysPressed[e.key] = false);

        // 物件
        let targets = [];
        let particles = [];
        let floatingTexts = [];
        let shakeFrames = 0;

        // --- 3. 遊戲流程 ---
        function startGame() {
            players.p1.score = 0; players.p2.score = 0;
            players.p1.x = canvas.width * 0.2; players.p1.y = canvas.height * 0.5;
            players.p2.x = canvas.width * 0.8; players.p2.y = canvas.height * 0.5;
            players.p1.vx = 0; players.p1.vy = 0;
            players.p2.vx = 0; players.p2.vy = 0;
            
            gameTime = 60;
            specialEventTriggered = false;
            ui.timer.classList.remove('timer-warning');
            
            ui.startScreen.style.display = 'none';
            ui.endScreen.style.display = 'none';
            ui.overlay.style.display = 'none';
            
            updateScoreUI();
            
            gameState = 'playing';
            generateQuestion();
            
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(gameTimerLogic, 1000);
            
            requestAnimationFrame(gameLoop);
        }

        function gameTimerLogic() {
            if (gameState !== 'playing') return;
            gameTime--;
            ui.timer.innerText = gameTime;

            if (gameTime <= 10) ui.timer.classList.add('timer-warning');

            // 觸發校慶特殊題 (最後10秒)
            if (gameTime === 10 && !specialEventTriggered) {
                triggerSpecialRound();
                specialEventTriggered = true;
            }

            if (gameTime <= 0) endGame();
        }

        // --- 4. 題目邏輯 ---
        function generateQuestion() {
            if (gameTime < 5 && specialEventTriggered) return; // 彩蛋進行中不切換

            // 70% 撞球，30% 生存
            let isSurvival = Math.random() < 0.3;
            if (isSurvival) {
                setSurvivalMode(false);
                generateSurvivalQuestion();
            } else {
                setBumperMode();
                generateBumperQuestion();
            }
        }

        function setBumperMode() {
            currentMode = 'bumper';
            ui.qContainer.classList.add('bumper-mode-q');
        }

        function setSurvivalMode(isSpecial) {
            currentMode = 'survival';
            ui.qContainer.classList.remove('bumper-mode-q');
            targets = []; // 清除所有球
        }

        function generateBumperQuestion() {
            let ops = ['+', '-', 'x'];
            let op = ops[Math.floor(Math.random()*ops.length)];
            let a = Math.floor(Math.random()*12)+1;
            let b = Math.floor(Math.random()*12)+1;
            let ans = (op==='x')?a*b : (op==='-')?(a+b)-b : a+b;
            let qStr = (op==='-') ? `${a+b} - ${b} = ?` : `${a} ${op==='x'?'×':op} ${b} = ?`;

            ui.qText.innerText = qStr;
            spawnBalls(ans);
        }

        function generateSurvivalQuestion() {
            // 產生4個位置的選項
            let types = ['angle', 'tri', 'math'];
            let type = types[Math.floor(Math.random()*types.length)];
            let qStr = "", opts = [];

            if(type === 'angle') {
                qStr = "快！停在「銳角」上！";
                opts = [
                    {val:45, isCorrect:true, type:'angle'},
                    {val:90, isCorrect:false, type:'angle'},
                    {val:135, isCorrect:false, type:'angle'},
                    {val:180, isCorrect:false, type:'angle'}
                ];
            } else if(type === 'tri') {
                qStr = "找出「直角三角形」";
                opts = [
                    {val:'right', isCorrect:true, type:'tri'},
                    {val:'acute', isCorrect:false, type:'tri'},
                    {val:'obtuse', isCorrect:false, type:'tri'},
                    {val:'acute', isCorrect:false, type:'tri'}
                ];
            } else {
                qStr = "找出 4 的倍數";
                opts = [
                    {val:12, isCorrect:true, type:'text'},
                    {val:7, isCorrect:false, type:'text'},
                    {val:15, isCorrect:false, type:'text'},
                    {val:22, isCorrect:false, type:'text'}
                ];
            }

            ui.qText.innerText = qStr;
            spawnZones(opts);
            startSurvivalCountdown();
        }

        function triggerSpecialRound() {
            setSurvivalMode(true);
            ui.qText.innerText = "今年是學校多少周年？";
            ui.qText.style.transform = "scale(1.5)";
            setTimeout(()=>ui.qText.style.transform="scale(1)", 300);

            // 4個選項
            let opts = [
                {val:20, isCorrect:false, type:'text'},
                {val:30, isCorrect:true, type:'text'}, // 答案
                {val:40, isCorrect:false, type:'text'},
                {val:50, isCorrect:false, type:'text'}
            ];
            
            spawnZones(opts);
            startSurvivalCountdown();
        }

        function startSurvivalCountdown() {
            survivalTimer = SURVIVAL_PREP_TIME;
            ui.survivalCnt.style.display = 'block';
            ui.survivalCnt.innerText = SURVIVAL_PREP_TIME;
        }

        // --- 5. 生成物件 (四角佈局) ---
        function spawnBalls(ans) {
            targets = [];
            let vals = [ans];
            while(vals.length < 5) {
                let r = ans + Math.floor(Math.random()*20)-10;
                if(r!==ans && r>0 && !vals.includes(r)) vals.push(r);
            }
            vals.sort(()=>Math.random()-0.5);

            vals.forEach(v => {
                targets.push({
                    type: 'ball',
                    x: Math.random()*(canvas.width-100)+50,
                    y: Math.random()*(canvas.height-250)+200,
                    r: 35, val: v, isCorrect: v===ans,
                    vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3
                });
            });
        }

        function spawnZones(options) {
            targets = []; // 確保清空
            options.sort(()=>Math.random()-0.5);
            
            // 四個角落座標 (避開 UI)
            const w = canvas.width, h = canvas.height;
            const positions = [
                {x: w*0.25, y: h*0.35}, // 左上
                {x: w*0.75, y: h*0.35}, // 右上
                {x: w*0.25, y: h*0.75}, // 左下
                {x: w*0.75, y: h*0.75}  // 右下
            ];

            options.forEach((opt, i) => {
                if(i < 4) { // 最多4個
                    targets.push({
                        type: 'zone',
                        x: positions[i].x,
                        y: positions[i].y,
                        r: 120, maxR: 120,
                        val: opt.val, isCorrect: opt.isCorrect,
                        drawType: opt.type
                    });
                }
            });
        }

        // --- 6. 物理與邏輯更新 ---
        function updatePhysics() {
            // 玩家移動
            [players.p1, players.p2].forEach(p => {
                if(keysPressed[p.keys.u]) p.vy -= 1.0;
                if(keysPressed[p.keys.d]) p.vy += 1.0;
                if(keysPressed[p.keys.l]) p.vx -= 1.0;
                if(keysPressed[p.keys.r]) p.vx += 1.0;
                p.vx *= 0.92; p.vy *= 0.92;
                p.x += p.vx; p.y += p.vy;

                // 邊界
                if(p.x<p.r) {p.x=p.r; p.vx*=-0.5;}
                if(p.x>canvas.width-p.r) {p.x=canvas.width-p.r; p.vx*=-0.5;}
                if(p.y<p.r+100) {p.y=p.r+100; p.vy*=-0.5;}
                if(p.y>canvas.height-p.r) {p.y=canvas.height-p.r; p.vy*=-0.5;}
            });

            // 玩家互撞 (強力推擠)
            let dx = players.p2.x - players.p1.x;
            let dy = players.p2.y - players.p1.y;
            let dist = Math.hypot(dx, dy);
            
            if(dist < players.p1.r + players.p2.r) {
                let angle = Math.atan2(dy, dx);
                // 修改：加大彈飛力度 (由 1.2 改為 3.0)
                let push = 3.0; 
                let px = Math.cos(angle)*push, py = Math.sin(angle)*push;
                
                players.p1.vx -= px; players.p1.vy -= py;
                players.p2.vx += px; players.p2.vy += py;
                
                // 防止重疊 (增加分離距離)
                let overlap = (players.p1.r + players.p2.r - dist) / 2 + 1;
                players.p1.x -= Math.cos(angle)*overlap; players.p1.y -= Math.sin(angle)*overlap;
                players.p2.x += Math.cos(angle)*overlap; players.p2.y += Math.sin(angle)*overlap;
                
                shakeScreen(5); // 加大震動
            }

            // 模式判定
            if(currentMode === 'bumper') updateBumperLogic();
            else updateSurvivalLogic();
        }

        function updateBumperLogic() {
            [players.p1, players.p2].forEach(p => {
                for(let i=targets.length-1; i>=0; i--) {
                    let t = targets[i];
                    if(t.type !== 'ball') continue;

                    t.x+=t.vx; t.y+=t.vy;
                    if(t.x<t.r||t.x>canvas.width-t.r) t.vx*=-1;
                    if(t.y<t.r+100||t.y>canvas.height-t.r) t.vy*=-1;

                    let d = Math.hypot(p.x - t.x, p.y - t.y);
                    if(d < p.r + t.r) {
                        if(t.isCorrect) {
                            p.score = parseFloat((p.score + 10).toFixed(1)); // +10分
                            spawnParticles(t.x, t.y, '#00ff00', 30);
                            spawnFloatText(t.x, t.y, "+10", p.color);
                            shakeScreen(10);
                            updateScoreUI();
                            generateQuestion(); // 下一題
                            return; 
                        } else {
                            p.score = parseFloat(Math.max(0, p.score - 1).toFixed(1)); // -1分
                            spawnParticles(t.x, t.y, '#ff0000', 10);
                            spawnFloatText(t.x, t.y, "-1", '#ff0000');
                            shakeScreen(5);
                            updateScoreUI();
                            t.vx = (t.x-p.x)*0.3; t.vy = (t.y-p.y)*0.3; // 彈飛
                        }
                    }
                }
            });
        }

        function updateSurvivalLogic() {
            survivalTimer -= 0.016; // 60fps

            if (survivalTimer > 0) {
                // 倒數階段
                ui.survivalCnt.innerText = Math.ceil(survivalTimer);
            } else {
                // 倒數結束
                ui.survivalCnt.style.display = 'none';
                
                if (specialEventTriggered) {
                    // --- 校慶特別邏輯：持續縮小與加分 ---
                    updateSpecialEventPhysics();
                } else {
                    // --- 普通生存：結算並換題 ---
                    checkSurvivalResult();
                    generateQuestion(); // 換題
                }
            }

            // 縮圈視覺效果 (只對 Zone 有效)
            targets.forEach(t => {
                if (t.type === 'zone') {
                    if (specialEventTriggered && survivalTimer <= 0) {
                        // 特別題：持續縮小
                        if(t.isCorrect) t.r = Math.max(30, t.r - 0.1); // 慢慢縮小到30
                        else t.r = Math.max(0, t.r - 2); // 錯誤選項快速消失
                    } else if (survivalTimer > 0) {
                        // 倒數時輕微縮放提示
                        t.r = t.maxR * (0.95 + Math.sin(Date.now()/200)*0.05);
                    }
                }
            });
        }

        function checkSurvivalResult() {
            let anyCorrect = false;
            [players.p1, players.p2].forEach(p => {
                let safe = false;
                targets.forEach(t => {
                    if (t.isCorrect && Math.hypot(p.x-t.x, p.y-t.y) < t.r) safe = true;
                });

                if (safe) {
                    p.score += 10;
                    spawnFloatText(p.x, p.y, "+10", p.color);
                    spawnParticles(p.x, p.y, '#ffff00', 30);
                    anyCorrect = true;
                } else {
                    p.score = Math.max(0, p.score - 1); // 沒站到可以選扣分或不扣，這裡設定扣1分
                    spawnFloatText(p.x, p.y, "Miss", "#aaa");
                    p.vx = (Math.random()-0.5)*30; p.vy = (Math.random()-0.5)*30; // 彈飛
                }
            });
            updateScoreUI();
            if (anyCorrect) shakeScreen(10);
        }

        function updateSpecialEventPhysics() {
            // 每 0.1 秒加 0.3 分
            let now = Date.now();
            let shouldAddScore = false;
            if (now - continuousScoreTimer > 100) {
                continuousScoreTimer = now;
                shouldAddScore = true;
            }

            targets.forEach(t => {
                if (t.isCorrect) {
                    // 檢查玩家是否在縮小的圈內
                    [players.p1, players.p2].forEach(p => {
                        let dist = Math.hypot(p.x - t.x, p.y - t.y);
                        if (dist < t.r) {
                            if (shouldAddScore) {
                                p.score = parseFloat((p.score + 0.3).toFixed(1));
                                spawnFloatText(p.x, p.y - 40, "+0.3", p.color); // 飄字
                            }
                        }
                    });
                }
            });
            if (shouldAddScore) updateScoreUI();
        }


        // --- 7. 繪圖 ---
        function draw() {
            let tx=0, ty=0;
            if(shakeFrames>0) {
                tx=(Math.random()-0.5)*shakeFrames; 
                ty=(Math.random()-0.5)*shakeFrames; 
                shakeFrames--;
            }
            ctx.save();
            ctx.translate(tx, ty);
            ctx.clearRect(0,0, canvas.width, canvas.height);

            // 背景網格
            ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth=1;
            for(let i=0; i<canvas.width; i+=100) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=100) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

            // 目標物件
            targets.forEach(t => {
                if(t.type === 'ball') {
                    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI*2);
                    ctx.fillStyle = '#222'; ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth=2; ctx.stroke();
                    ctx.fillStyle='#fff'; ctx.font='bold 24px Arial';
                    ctx.textAlign='center'; ctx.textBaseline='middle';
                    ctx.fillText(t.val, t.x, t.y);
                } else if (t.type === 'zone') {
                    if (t.r <= 0) return; // 消失的不畫
                    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI*2);
                    
                    // 特別題30顯示金色
                    let isSpecial30 = (specialEventTriggered && t.val===30);
                    ctx.fillStyle = isSpecial30 ? 'rgba(255,215,0,0.2)' : 'rgba(0,243,255,0.15)';
                    ctx.fill();
                    ctx.strokeStyle = isSpecial30 ? '#ffd700' : '#00f3ff';
                    ctx.lineWidth = 4; ctx.stroke();

                    drawZoneContent(t);
                }
            });

            // 玩家
            [players.p1, players.p2].forEach(p => {
                ctx.shadowBlur = 15; ctx.shadowColor = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                ctx.fillStyle = p.color; ctx.fill();
                // 箭頭
                let angle = (Math.abs(p.vx)<0.1 && Math.abs(p.vy)<0.1) ? -Math.PI/2 : Math.atan2(p.vy, p.vx);
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.beginPath(); ctx.arc(p.x+Math.cos(angle)*15, p.y+Math.sin(angle)*15, 8, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // 特效
            particles.forEach((p, i) => {
                p.x+=p.vx; p.y+=p.vy; p.life-=0.05;
                if(p.life>0) {ctx.globalAlpha=p.life; ctx.fillStyle=p.color; ctx.fillRect(p.x,p.y,5,5);}
                else particles.splice(i,1);
            });
            ctx.globalAlpha=1;

            floatingTexts.forEach((ft, i) => {
                ft.y-=1; ft.life-=0.02;
                if(ft.life>0) {ctx.globalAlpha=ft.life; ctx.font="bold 30px Arial"; ctx.fillStyle=ft.color; ctx.fillText(ft.text, ft.x, ft.y);}
                else floatingTexts.splice(i,1);
            });
            ctx.globalAlpha=1;

            ctx.restore();
        }

        function drawZoneContent(t) {
            ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
            // 隨圓圈縮小而縮小文字
            let scale = Math.min(1, t.r / 60); 
            
            if (t.drawType === 'text') {
                ctx.font = `bold ${40 * scale}px Arial`;
                ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillText(t.val, t.x, t.y);
            } else if (t.drawType === 'angle') {
                let s = scale;
                ctx.beginPath(); ctx.moveTo(t.x+30*s, t.y); ctx.lineTo(t.x-20*s, t.y);
                if(t.val===90) ctx.lineTo(t.x-20*s, t.y-50*s);
                else if(t.val===45) ctx.lineTo(t.x+20*s, t.y-40*s);
                else ctx.lineTo(t.x-50*s, t.y-30*s);
                ctx.stroke();
            } else if (t.drawType === 'tri') {
                let s = scale;
                ctx.beginPath();
                if(t.val==='right') { ctx.moveTo(t.x-20*s,t.y+20*s); ctx.lineTo(t.x+20*s,t.y+20*s); ctx.lineTo(t.x-20*s,t.y-30*s); }
                else if(t.val==='acute') { ctx.moveTo(t.x-25*s,t.y+20*s); ctx.lineTo(t.x+25*s,t.y+20*s); ctx.lineTo(t.x,t.y-30*s); }
                else { ctx.moveTo(t.x-30*s,t.y+20*s); ctx.lineTo(t.x+40*s,t.y+20*s); ctx.lineTo(t.x-10*s,t.y-20*s); }
                ctx.closePath(); ctx.stroke();
            }
        }

        // --- 8. 輔助 ---
        function spawnParticles(x, y, color, count) {
            for(let i=0; i<count; i++) particles.push({x, y, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10, life:1.0, color});
        }
        function spawnFloatText(x, y, text, color) {
            floatingTexts.push({x, y, text, color, life:1.0});
        }
        function shakeScreen(n) { shakeFrames = n; }
        function updateScoreUI() {
            ui.p1Score.innerText = players.p1.score.toFixed(1);
            ui.p2Score.innerText = players.p2.score.toFixed(1);
        }

        function gameLoop() {
            if (gameState === 'playing') {
                updatePhysics();
                draw();
            } else {
                draw();
            }
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameState = 'end';
            clearInterval(timerInterval);
            
            ui.overlay.style.display = 'flex';
            ui.startScreen.style.display = 'none';
            ui.endScreen.style.display = 'flex';
            ui.survivalCnt.style.display = 'none';
            
            ui.endP1.innerText = players.p1.score.toFixed(1);
            ui.endP2.innerText = players.p2.score.toFixed(1);

            ui.p1WinMsg.style.display = 'none';
            ui.p2WinMsg.style.display = 'none';
            
            let p1s = players.p1.score, p2s = players.p2.score;
            if (p1s > p2s) {
                ui.p1WinMsg.style.display = 'block';
                showWinnerInput(p1s);
            } else if (p2s > p1s) {
                ui.p2WinMsg.style.display = 'block';
                showWinnerInput(p2s);
            } else {
                ui.inputSec.style.display = 'none';
                ui.replaySec.style.display = 'block';
            }
            renderLeaderboard();
        }

        function showWinnerInput(score) {
            window.winningScore = score;
            ui.inputSec.style.display = 'block';
            ui.replaySec.style.display = 'none';
        }

        // 排行榜 (LocalStorage)
        const LB_KEY = 'school_30th_lb_v2';
        function submitScore() {
            let name = ui.winnerInput.value.toUpperCase() || "AAA";
            let lb = JSON.parse(localStorage.getItem(LB_KEY) || "[]");
            lb.push({name: name, score: window.winningScore});
            lb.sort((a,b) => b.score - a.score);
            lb = lb.slice(0, 10);
            localStorage.setItem(LB_KEY, JSON.stringify(lb));
            ui.inputSec.style.display = 'none';
            ui.replaySec.style.display = 'block';
            renderLeaderboard();
        }
        function renderLeaderboard() {
            let lb = JSON.parse(localStorage.getItem(LB_KEY) || "[]");
            let html = '';
            for(let i=0; i<10; i++) {
                let item = lb[i] || {name:'-', score:'-'};
                html += `<div class="lb-item"><span class="lb-rank">${i+1}.</span><span class="lb-name">${item.name}</span><span class="lb-score">${item.score}</span></div>`;
            }
            ui.lbList.innerHTML = html;
        }

    </script>
</body>
</html>
