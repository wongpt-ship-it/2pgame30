<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>校慶 30：光速腦力戰域</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            color: white;
            user-select: none; /* 禁止選取文字 */
        }
        canvas { display: block; }

        /* --- UI 佈局 --- */
        #hud {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* 讓點擊穿透 */
            display: flex;
            flex-direction: column;
            z-index: 5;
        }

        /* 頂部資訊列 (P1 左, P2 右) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 20px 40px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .score-box {
            font-size: 4vw;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #p1-score-box { color: #00f3ff; text-shadow: 0 0 20px #00f3ff; }
        #p2-score-box { color: #ff0055; text-shadow: 0 0 20px #ff0055; }
        .player-label { font-size: 1.5vw; opacity: 0.8; }

        /* 中間倒數計時 */
        #timer-box {
            font-size: 5vw;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 5px 30px;
            border-radius: 0 0 20px 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: none;
            text-shadow: 0 0 10px white;
            min-width: 100px;
            text-align: center;
        }
        .timer-warning { color: #ff3333 !important; animation: pulse 0.5s infinite; }

        /* 題目顯示 */
        #question-container {
            position: absolute;
            top: 18%;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }
        #question-text {
            display: inline-block;
            font-size: 4vw;
            font-weight: bold;
            background: linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,0.8), rgba(0,0,0,0));
            padding: 10px 50px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            border-top: 2px solid rgba(255,255,255,0.2);
            border-bottom: 2px solid rgba(255,255,255,0.2);
            transition: transform 0.2s;
        }

        /* 3秒生存倒數 */
        #survival-countdown {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20vw;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 0 50px #ffcc00;
            display: none;
            z-index: 20;
        }

        /* --- 結算/開始 畫面 (Z-Index 確保最上層) --- */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 16, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto; /* 這裡需要可以點擊 */
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .screen-content {
            text-align: center;
            width: 100%;
        }

        /* 結算佈局 */
        .result-container {
            display: flex;
            width: 90%;
            height: 80%;
            gap: 20px;
            margin: auto;
        }
        
        .result-col {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .result-p1 { border-color: #00f3ff; box-shadow: 0 0 20px rgba(0,243,255,0.2); }
        .result-p2 { border-color: #ff0055; box-shadow: 0 0 20px rgba(255,0,85,0.2); }
        .result-center { flex: 1.2; background: rgba(0,0,0,0.3); }

        h2 { margin: 0 0 20px 0; font-size: 2.5vw; text-transform: uppercase; }
        .big-score { font-size: 8vw; font-weight: 900; margin: auto; }
        
        /* 排行榜列表 */
        .leaderboard-list {
            width: 100%;
            text-align: left;
            font-size: 1.2vw;
            color: #ccc;
            overflow-y: auto;
            max-height: 40vh;
        }
        .lb-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .lb-rank { width: 30px; font-weight: bold; color: #ffcc00; }
        .lb-name { flex: 1; text-align: center;}
        .lb-score { width: 50px; text-align: right; color: white; }

        /* 按鈕與輸入框 */
        input {
            background: transparent;
            border: 2px solid white;
            color: white;
            font-size: 2vw;
            padding: 5px;
            text-align: center;
            width: 200px;
            text-transform: uppercase;
            border-radius: 10px;
        }
        
        button {
            margin-top: 30px;
            padding: 15px 50px;
            font-size: 2vw;
            background: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
            transition: all 0.2s;
        }
        button:hover { transform: scale(1.1); box-shadow: 0 0 40px rgba(255,255,255,0.8); }
        button:active { transform: scale(0.95); }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div class="top-bar">
            <div class="score-box" id="p1-score-box">
                <span class="player-label">P1 藍隊</span>
                <span id="p1-score">0</span>
            </div>
            <div id="timer-box">60</div>
            <div class="score-box" id="p2-score-box">
                <span class="player-label">P2 紅隊</span>
                <span id="p2-score">0</span>
            </div>
        </div>
        <div id="question-container">
            <div id="question-text">準備開始...</div>
        </div>
        <div id="survival-countdown">3</div>
    </div>

    <!-- 覆蓋層：開始與結束 -->
    <div id="overlay">
        <!-- 開始畫面 -->
        <div id="start-screen" class="screen-content">
            <h1 style="font-size:5vw; color:white; text-shadow:0 0 30px #00f3ff; margin-bottom:10px; margin-top:0;">
                校慶 30：光速腦力戰域
            </h1>
            <p style="font-size:1.5vw; color:#aaa; margin-bottom: 40px;">
                P1: <b>WASD</b> &nbsp;|&nbsp; P2: <b>方向鍵</b>
            </p>
            <p style="color:#ffcc00; font-size: 1.2vw;">
                最後 10 秒將出現「校慶特別生存題」，請做好準備！
            </p>
            <!-- 確保 id 存在 -->
            <button id="start-btn">開始對戰 (60秒)</button>
        </div>

        <!-- 結束畫面 -->
        <div id="end-screen" class="result-container" style="display:none;">
            <!-- P1 結果 -->
            <div class="result-col result-p1">
                <h2>P1 藍隊</h2>
                <div class="big-score" id="end-p1-score">0</div>
                <div id="p1-win-msg" style="display:none; color:#00f3ff; font-weight:bold; font-size:3vw; margin-top:20px;">WINNER</div>
            </div>

            <!-- 排行榜 -->
            <div class="result-col result-center">
                <h2>TOP 10 排行榜</h2>
                <div class="leaderboard-list" id="lb-list"></div>
                
                <div id="winner-input-section" style="margin-top:20px; display:none;">
                    <p style="margin:5px;">恭喜獲勝！輸入名字：</p>
                    <input type="text" id="winner-name" maxlength="5" placeholder="NAME">
                    <br>
                    <button id="submit-score-btn" style="font-size: 1.5vw; padding: 10px 30px;">儲存</button>
                </div>
                <div id="replay-btn-section" style="display:none; text-align:center;">
                    <button id="replay-btn" style="font-size: 1.5vw; padding: 10px 30px;">再玩一次</button>
                </div>
            </div>

            <!-- P2 結果 -->
            <div class="result-col result-p2">
                <h2>P2 紅隊</h2>
                <div class="big-score" id="end-p2-score">0</div>
                <div id="p2-win-msg" style="display:none; color:#ff0055; font-weight:bold; font-size:3vw; margin-top:20px;">WINNER</div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 初始化系統 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI 綁定
        const ui = {
            timer: document.getElementById('timer-box'),
            qText: document.getElementById('question-text'),
            p1Score: document.getElementById('p1-score'),
            p2Score: document.getElementById('p2-score'),
            survivalCnt: document.getElementById('survival-countdown'),
            overlay: document.getElementById('overlay'),
            startScreen: document.getElementById('start-screen'),
            endScreen: document.getElementById('end-screen'),
            endP1: document.getElementById('end-p1-score'),
            endP2: document.getElementById('end-p2-score'),
            inputSec: document.getElementById('winner-input-section'),
            replaySec: document.getElementById('replay-btn-section'),
            winnerInput: document.getElementById('winner-name'),
            lbList: document.getElementById('lb-list'),
            p1WinMsg: document.getElementById('p1-win-msg'),
            p2WinMsg: document.getElementById('p2-win-msg')
        };

        // 按鈕事件綁定 (確保 DOM 載入後綁定)
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('submit-score-btn').addEventListener('click', submitScore);
        document.getElementById('replay-btn').addEventListener('click', () => location.reload());

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- 2. 遊戲參數 ---
        let gameState = 'start'; // start, playing, end
        let gameTime = 60;
        let timerInterval = null;
        let specialEventTriggered = false; // 是否已觸發校慶彩蛋
        let winningScore = 0;

        // 模式控制
        let currentMode = 'bumper'; // 'bumper'(撞球) 或 'survival'(搶地盤)
        let survivalTimer = 0;
        const SURVIVAL_PREP_TIME = 3; // 倒數時間

        // 玩家狀態
        const players = {
            p1: { x: 0, y: 0, r: 25, color: '#00f3ff', score: 0, vx: 0, vy: 0, keys: {u:'w', d:'s', l:'a', r:'d'} },
            p2: { x: 0, y: 0, r: 25, color: '#ff0055', score: 0, vx: 0, vy: 0, keys: {u:'ArrowUp', d:'ArrowDown', l:'ArrowLeft', r:'ArrowRight'} }
        };
        const keysPressed = {};

        // 監聽鍵盤
        window.addEventListener('keydown', (e) => keysPressed[e.key] = true);
        window.addEventListener('keyup', (e) => keysPressed[e.key] = false);

        // 遊戲物件
        let targets = []; // 存放球或地盤
        let particles = [];
        let floatingTexts = [];
        let shakeFrames = 0;

        // --- 3. 核心流程 ---
        function startGame() {
            console.log("Game Starting..."); // Debug
            // 重置參數
            players.p1.score = 0; 
            players.p2.score = 0;
            players.p1.x = canvas.width * 0.2; players.p1.y = canvas.height * 0.5;
            players.p2.x = canvas.width * 0.8; players.p2.y = canvas.height * 0.5;
            players.p1.vx = 0; players.p1.vy = 0;
            players.p2.vx = 0; players.p2.vy = 0;
            
            gameTime = 60;
            specialEventTriggered = false;
            ui.timer.classList.remove('timer-warning');
            
            // UI 切換
            ui.startScreen.style.display = 'none';
            ui.endScreen.style.display = 'none';
            ui.overlay.style.display = 'none';
            
            updateScoreUI();
            
            // 啟動迴圈
            gameState = 'playing';
            generateQuestion();
            
            // 啟動計時器
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(gameTimerLogic, 1000);
            
            requestAnimationFrame(gameLoop);
        }

        function gameTimerLogic() {
            if (gameState !== 'playing') return;
            
            gameTime--;
            ui.timer.innerText = gameTime;

            // 10秒以下變紅警告
            if (gameTime <= 10) ui.timer.classList.add('timer-warning');

            // --- 校慶彩蛋觸發點 (剩 10 秒時) ---
            if (gameTime === 10 && !specialEventTriggered) {
                triggerSpecialRound();
                specialEventTriggered = true;
            }

            // 時間到
            if (gameTime <= 0) {
                endGame();
            }
        }

        // --- 4. 題目系統 ---
        function generateQuestion() {
            // 如果剛觸發完彩蛋，不要再生成新題目 (等待結束)
            if (gameTime < 5 && specialEventTriggered) return;

            // 隨機模式: 70% 撞球(運算), 30% 生存(幾何/邏輯)
            let isSurvival = Math.random() < 0.3;
            
            if (isSurvival) {
                currentMode = 'survival';
                generateSurvivalQuestion();
            } else {
                currentMode = 'bumper';
                generateBumperQuestion();
            }
        }

        function triggerSpecialRound() {
            console.log("30th Anniversary Event Triggered!");
            currentMode = 'survival';
            ui.qText.innerText = "今年是學校多少周年？";
            ui.qText.style.transform = "scale(1.5)";
            setTimeout(() => ui.qText.style.transform = "scale(1)", 300);

            // 生成選項：20, 30, 40 (30是正確答案)
            let opts = [
                { val: 20, isCorrect: false, type: 'text' },
                { val: 30, isCorrect: true, type: 'text' }, // 答案
                { val: 40, isCorrect: false, type: 'text' }
            ];
            
            // 清除現有球，生成地盤
            targets = [];
            spawnZones(opts);
            
            // 開始倒數
            survivalTimer = SURVIVAL_PREP_TIME;
            ui.survivalCnt.style.display = 'block';
            ui.survivalCnt.innerText = "3";
        }

        function generateBumperQuestion() {
            // 隨機運算題
            let types = ['+', '-', 'x'];
            let op = types[Math.floor(Math.random() * types.length)];
            let a, b, ans;

            if (op === 'x') {
                a = Math.floor(Math.random()*9)+2; 
                b = Math.floor(Math.random()*9)+2;
                ans = a*b;
            } else if (op === '-') {
                a = Math.floor(Math.random()*20)+10;
                b = Math.floor(Math.random()*10)+1;
                ans = a-b;
            } else {
                a = Math.floor(Math.random()*20)+1;
                b = Math.floor(Math.random()*20)+1;
                ans = a+b;
            }

            ui.qText.innerText = `${a} ${op === 'x' ? '×' : op} ${b} = ?`;
            spawnBalls(ans);
        }

        function generateSurvivalQuestion() {
            // 隨機幾何/邏輯題
            let type = Math.floor(Math.random() * 3);
            let qStr = "";
            let opts = [];

            if (type === 0) {
                qStr = "快！停在「直角」上！";
                opts = [
                    { val: 90, isCorrect: true, type: 'angle' },
                    { val: 45, isCorrect: false, type: 'angle' },
                    { val: 135, isCorrect: false, type: 'angle' }
                ];
            } else if (type === 1) {
                qStr = "找出「倍數」最多的數字";
                // 12 (1,2,3,4,6,12 - 6個), 7 (1,7 - 2個), 13 (1,13 - 2個)
                opts = [
                    { val: 12, isCorrect: true, type: 'text' },
                    { val: 7, isCorrect: false, type: 'text' },
                    { val: 13, isCorrect: false, type: 'text' }
                ];
            } else {
                qStr = "哪個圖形是「鈍角三角形」？";
                opts = [
                    { val: 'obtuse', isCorrect: true, type: 'tri' },
                    { val: 'right', isCorrect: false, type: 'tri' },
                    { val: 'acute', isCorrect: false, type: 'tri' }
                ];
            }
            ui.qText.innerText = qStr;
            spawnZones(opts);
            
            survivalTimer = SURVIVAL_PREP_TIME;
            ui.survivalCnt.style.display = 'block';
            ui.survivalCnt.innerText = "3";
        }

        // --- 5. 物件生成與物理 ---
        function spawnBalls(ans) {
            targets = [];
            // 生成 5 顆球
            let vals = [ans];
            while(vals.length < 5) {
                let r = ans + Math.floor(Math.random()*20)-10;
                if(r!==ans && r>0 && !vals.includes(r)) vals.push(r);
            }
            vals.sort(()=>Math.random()-0.5);

            vals.forEach(v => {
                targets.push({
                    type: 'ball',
                    x: Math.random()*(canvas.width-100)+50,
                    y: Math.random()*(canvas.height-250)+200,
                    r: 35,
                    val: v,
                    isCorrect: v === ans,
                    vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3
                });
            });
        }

        function spawnZones(options) {
            options.sort(()=>Math.random()-0.5); // 打亂位置
            let sectionW = canvas.width / (options.length);
            
            options.forEach((opt, i) => {
                targets.push({
                    type: 'zone',
                    x: sectionW * i + sectionW/2,
                    y: canvas.height * 0.6,
                    r: 130, // 初始半徑
                    maxR: 130,
                    val: opt.val,
                    isCorrect: opt.isCorrect,
                    drawType: opt.type // text, angle, tri
                });
            });
        }

        function updatePhysics() {
            // 玩家移動
            [players.p1, players.p2].forEach(p => {
                if(keysPressed[p.keys.u]) p.vy -= 1.0;
                if(keysPressed[p.keys.d]) p.vy += 1.0;
                if(keysPressed[p.keys.l]) p.vx -= 1.0;
                if(keysPressed[p.keys.r]) p.vx += 1.0;
                
                // 摩擦與移動
                p.vx *= 0.92; p.vy *= 0.92;
                p.x += p.vx; p.y += p.vy;

                // 邊界
                if(p.x < p.r) { p.x = p.r; p.vx *= -0.5; }
                if(p.x > canvas.width-p.r) { p.x = canvas.width-p.r; p.vx *= -0.5; }
                if(p.y < p.r+120) { p.y = p.r+120; p.vy *= -0.5; } // 避開頂部
                if(p.y > canvas.height-p.r) { p.y = canvas.height-p.r; p.vy *= -0.5; }
            });

            // 玩家互撞
            let dx = players.p2.x - players.p1.x;
            let dy = players.p2.y - players.p1.y;
            let dist = Math.hypot(dx, dy);
            if (dist < players.p1.r + players.p2.r) {
                let angle = Math.atan2(dy, dx);
                let push = 1.2; // 彈力係數
                let px = Math.cos(angle) * push;
                let py = Math.sin(angle) * push;
                players.p1.vx -= px; players.p1.vy -= py;
                players.p2.vx += px; players.p2.vy += py;
                
                // 防止重疊
                let overlap = (players.p1.r + players.p2.r - dist) / 2;
                players.p1.x -= Math.cos(angle)*overlap; players.p1.y -= Math.sin(angle)*overlap;
                players.p2.x += Math.cos(angle)*overlap; players.p2.y += Math.sin(angle)*overlap;
                
                shakeScreen(3); // 輕微震動
            }

            // 模式邏輯
            if (currentMode === 'bumper') {
                // 撞球判定
                [players.p1, players.p2].forEach(p => {
                    for(let i=targets.length-1; i>=0; i--) {
                        let t = targets[i];
                        if(t.type !== 'ball') continue;
                        let d = Math.hypot(p.x - t.x, p.y - t.y);
                        
                        // 球移動
                        t.x += t.vx; t.y += t.vy;
                        if(t.x<t.r || t.x>canvas.width-t.r) t.vx*=-1;
                        if(t.y<t.r+150 || t.y>canvas.height-t.r) t.vy*=-1;

                        // 碰撞
                        if (d < p.r + t.r) {
                            if (t.isCorrect) {
                                p.score += 2;
                                spawnParticles(t.x, t.y, '#00ff00', 20);
                                spawnFloatText(t.x, t.y, "+2", p.color);
                                shakeScreen(10);
                                updateScoreUI();
                                generateQuestion(); // 下一題
                                return;
                            } else {
                                p.score = Math.max(0, p.score - 1);
                                spawnParticles(t.x, t.y, '#ff0000', 10);
                                spawnFloatText(t.x, t.y, "-1", '#ff0000');
                                shakeScreen(5);
                                updateScoreUI();
                                t.vx = (t.x - p.x)*0.2; t.vy = (t.y - p.y)*0.2; // 彈飛
                            }
                        }
                    }
                });
            } else if (currentMode === 'survival') {
                // 生存倒數
                survivalTimer -= 0.016; // 60fps approx
                if (survivalTimer > 0) {
                    ui.survivalCnt.innerText = Math.ceil(survivalTimer);
                } else {
                    // 時間到，縮圈結算
                    ui.survivalCnt.style.display = 'none';
                    checkSurvival();
                }

                // 縮圈動畫
                targets.forEach(t => {
                    if (t.type === 'zone') {
                        // 如果倒數完畢，保持最小，否則隨時間縮小
                        let progress = Math.max(0, survivalTimer / SURVIVAL_PREP_TIME);
                        t.r = t.maxR * (0.4 + 0.6 * progress);
                    }
                });
            }
        }

        function checkSurvival() {
            // 檢查誰在正確圈內
            let anyCorrect = false;
            [players.p1, players.p2].forEach(p => {
                let safe = false;
                targets.forEach(t => {
                    if (t.isCorrect) {
                        let d = Math.hypot(p.x - t.x, p.y - t.y);
                        if (d < t.r) safe = true;
                    }
                });

                if (safe) {
                    let pts = 5;
                    // 如果是校慶特別題，加 10 分！
                    if (specialEventTriggered && gameTime <= 10) pts = 10;
                    
                    p.score += pts;
                    spawnFloatText(p.x, p.y, "+"+pts, p.color);
                    spawnParticles(p.x, p.y, '#ffff00', 30);
                    anyCorrect = true;
                } else {
                    // 處罰彈飛
                    p.vx = (Math.random()-0.5)*40;
                    p.vy = (Math.random()-0.5)*40;
                    spawnFloatText(p.x, p.y, "Miss!", "#fff");
                }
            });
            updateScoreUI();
            
            if (anyCorrect) shakeScreen(15);
            
            // 下一題 (如果是彩蛋題，就不再生成了，等時間到)
            if (!specialEventTriggered) {
                generateQuestion();
            }
        }

        // --- 6. 繪圖與特效 ---
        function draw() {
            // 震動處理
            let tx=0, ty=0;
            if(shakeFrames>0) {
                tx=(Math.random()-0.5)*shakeFrames; 
                ty=(Math.random()-0.5)*shakeFrames; 
                shakeFrames--;
            }

            ctx.save();
            ctx.translate(tx, ty);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 背景網格
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=100) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=100) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

            // 畫目標
            targets.forEach(t => {
                if(t.type === 'ball') {
                    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI*2);
                    ctx.fillStyle = '#222'; ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth=2; ctx.stroke();
                    ctx.fillStyle='#fff'; ctx.font='bold 24px Arial';
                    ctx.textAlign='center'; ctx.textBaseline='middle';
                    ctx.fillText(t.val, t.x, t.y);
                } else if (t.type === 'zone') {
                    // 地板光圈
                    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI*2);
                    // 特別題如果是30，顯示金色光圈
                    let color = (specialEventTriggered && t.val===30) ? 'rgba(255, 215, 0, 0.1)' : 'rgba(0, 243, 255, 0.1)';
                    ctx.fillStyle = color; ctx.fill();
                    ctx.strokeStyle = (specialEventTriggered && t.val===30) ? '#ffd700' : '#00f3ff'; 
                    ctx.lineWidth = 4; ctx.stroke();
                    
                    // 畫內容
                    drawZoneContent(t);
                }
            });

            // 畫玩家
            [players.p1, players.p2].forEach(p => {
                ctx.shadowBlur = 15; ctx.shadowColor = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                ctx.fillStyle = p.color; ctx.fill();
                // 車頭指示
                let angle = (Math.abs(p.vx)<0.1 && Math.abs(p.vy)<0.1) ? -Math.PI/2 : Math.atan2(p.vy, p.vx);
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.beginPath(); ctx.arc(p.x+Math.cos(angle)*15, p.y+Math.sin(angle)*15, 8, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // 特效
            particles.forEach((p, i) => {
                p.x+=p.vx; p.y+=p.vy; p.life-=0.03;
                if(p.life>0) { ctx.globalAlpha=p.life; ctx.fillStyle=p.color; ctx.fillRect(p.x, p.y, 5, 5); }
                else particles.splice(i,1);
            });
            ctx.globalAlpha=1;

            floatingTexts.forEach((ft, i) => {
                ft.y-=1; ft.life-=0.02;
                if(ft.life>0) { ctx.globalAlpha=ft.life; ctx.font="bold 40px Arial"; ctx.fillStyle=ft.color; ctx.fillText(ft.text, ft.x, ft.y); }
                else floatingTexts.splice(i,1);
            });
            ctx.globalAlpha=1;

            ctx.restore();
        }

        function drawZoneContent(t) {
            ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
            if (t.drawType === 'text') {
                ctx.font = 'bold 50px Arial';
                ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillText(t.val, t.x, t.y);
            } else if (t.drawType === 'angle') {
                // 畫角度示意圖
                ctx.beginPath(); ctx.moveTo(t.x+30, t.y); ctx.lineTo(t.x-20, t.y);
                if(t.val===90) ctx.lineTo(t.x-20, t.y-50);
                else if(t.val===45) ctx.lineTo(t.x+20, t.y-40);
                else ctx.lineTo(t.x-50, t.y-30);
                ctx.stroke();
            } else if (t.drawType === 'tri') {
                ctx.beginPath();
                if(t.val==='right') { ctx.moveTo(t.x-20,t.y+20); ctx.lineTo(t.x+20,t.y+20); ctx.lineTo(t.x-20,t.y-30); }
                else if(t.val==='acute') { ctx.moveTo(t.x-25,t.y+20); ctx.lineTo(t.x+25,t.y+20); ctx.lineTo(t.x,t.y-30); }
                else { ctx.moveTo(t.x-30,t.y+20); ctx.lineTo(t.x+40,t.y+20); ctx.lineTo(t.x-10,t.y-20); }
                ctx.closePath(); ctx.stroke();
            }
        }

        // --- 7. 輔助函數 ---
        function spawnParticles(x, y, color, count) {
            for(let i=0; i<count; i++) particles.push({x, y, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10, life:1.0, color});
        }
        function spawnFloatText(x, y, text, color) {
            floatingTexts.push({x, y, text, color, life:1.0});
        }
        function shakeScreen(n) { shakeFrames = n; }
        function updateScoreUI() {
            ui.p1Score.innerText = players.p1.score;
            ui.p2Score.innerText = players.p2.score;
        }

        function gameLoop() {
            if (gameState === 'playing') {
                updatePhysics();
                draw();
            } else {
                // 暫停時也要畫畫面，只是不更新物理
                draw(); 
            }
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameState = 'end';
            clearInterval(timerInterval);
            
            ui.overlay.style.display = 'flex';
            ui.startScreen.style.display = 'none';
            ui.endScreen.style.display = 'flex';
            ui.survivalCnt.style.display = 'none'; // 隱藏倒數
            
            ui.endP1.innerText = players.p1.score;
            ui.endP2.innerText = players.p2.score;

            // 判斷勝負
            ui.p1WinMsg.style.display = 'none';
            ui.p2WinMsg.style.display = 'none';
            
            let winner = null;
            if (players.p1.score > players.p2.score) {
                winner = 'P1';
                ui.p1WinMsg.style.display = 'block';
            } else if (players.p2.score > players.p1.score) {
                winner = 'P2';
                ui.p2WinMsg.style.display = 'block';
            }

            // 渲染排行榜
            renderLeaderboard();

            if (winner) {
                ui.inputSec.style.display = 'block';
                ui.replaySec.style.display = 'none';
                winningScore = Math.max(players.p1.score, players.p2.score);
            } else {
                // 平手
                ui.inputSec.style.display = 'none';
                ui.replaySec.style.display = 'block';
            }
        }

        // --- 8. 排行榜系統 ---
        const LB_KEY = 'school_30th_lb';
        function getLeaderboard() {
            let d = localStorage.getItem(LB_KEY);
            return d ? JSON.parse(d) : [];
        }
        function submitScore() {
            let name = ui.winnerInput.value.toUpperCase() || "AAA";
            let lb = getLeaderboard();
            lb.push({name: name, score: winningScore});
            lb.sort((a,b) => b.score - a.score);
            lb = lb.slice(0, 10);
            localStorage.setItem(LB_KEY, JSON.stringify(lb));
            
            ui.inputSec.style.display = 'none';
            ui.replaySec.style.display = 'block';
            renderLeaderboard();
        }
        function renderLeaderboard() {
            let lb = getLeaderboard();
            let html = '';
            for(let i=0; i<10; i++) {
                let item = lb[i] || {name:'-', score:'-'};
                html += `<div class="lb-item"><span class="lb-rank">${i+1}.</span><span class="lb-name">${item.name}</span><span class="lb-score">${item.score}</span></div>`;
            }
            ui.lbList.innerHTML = html;
        }

    </script>
</body>
</html>
