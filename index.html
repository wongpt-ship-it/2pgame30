<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>霓虹全能對戰王</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            color: white;
            user-select: none;
        }
        canvas { display: block; }

        /* --- UI 佈局 --- */
        #hud {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        /* 頂部資訊列 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 20px 40px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .score-box {
            font-size: 4vw;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #p1-score-box { color: #00f3ff; text-shadow: 0 0 20px #00f3ff; }
        #p2-score-box { color: #ff0055; text-shadow: 0 0 20px #ff0055; }
        .player-label { font-size: 1.5vw; opacity: 0.8; }

        /* 中間倒數計時 */
        #timer-box {
            font-size: 5vw;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 5px 30px;
            border-radius: 0 0 20px 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: none;
            text-shadow: 0 0 10px white;
        }
        .timer-warning { color: #ff3333 !important; animation: pulse 0.5s infinite; }

        /* 題目顯示 */
        #question-container {
            position: absolute;
            top: 15%;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }
        #question-text {
            display: inline-block;
            font-size: 4vw;
            font-weight: bold;
            background: linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,0.8), rgba(0,0,0,0));
            padding: 10px 50px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            border-top: 2px solid rgba(255,255,255,0.2);
            border-bottom: 2px solid rgba(255,255,255,0.2);
        }

        /* 3秒生存倒數 */
        #survival-countdown {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 15vw;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 0 50px #ffcc00;
            display: none;
            z-index: 5;
        }

        /* --- 結算/開始 畫面 --- */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 16, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        /* 結算佈局：左中右 */
        .result-container {
            display: flex;
            width: 90%;
            height: 80%;
            gap: 20px;
        }
        
        .result-col {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .result-p1 { border-color: #00f3ff; box-shadow: 0 0 20px rgba(0,243,255,0.2); }
        .result-p2 { border-color: #ff0055; box-shadow: 0 0 20px rgba(255,0,85,0.2); }
        .result-center { flex: 1.2; background: rgba(0,0,0,0.3); }

        h2 { margin: 0 0 20px 0; font-size: 2.5vw; text-transform: uppercase; }
        .big-score { font-size: 8vw; font-weight: 900; margin: auto; }
        
        /* 排行榜列表 */
        .leaderboard-list {
            width: 100%;
            text-align: left;
            font-size: 1.2vw;
            color: #ccc;
        }
        .lb-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .lb-rank { width: 30px; font-weight: bold; color: #ffcc00; }
        .lb-name { flex: 1; text-align: center;}
        .lb-score { width: 50px; text-align: right; color: white; }

        /* 輸入名字 */
        #winner-input-section {
            margin-top: 20px;
            text-align: center;
            display: none; /* 獲勝才顯示 */
        }
        input {
            background: transparent;
            border: 2px solid white;
            color: white;
            font-size: 2vw;
            padding: 5px;
            text-align: center;
            width: 150px;
            text-transform: uppercase;
        }
        
        button {
            margin-top: 20px;
            padding: 10px 40px;
            font-size: 1.5vw;
            background: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 0 15px white; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div class="top-bar">
            <div class="score-box" id="p1-score-box">
                <span class="player-label">P1 藍隊</span>
                <span id="p1-score">0</span>
            </div>
            <div id="timer-box">60</div>
            <div class="score-box" id="p2-score-box">
                <span class="player-label">P2 紅隊</span>
                <span id="p2-score">0</span>
            </div>
        </div>
        <div id="question-container">
            <div id="question-text">準備開始...</div>
        </div>
        <div id="survival-countdown">3</div>
    </div>

    <!-- 結算/開始介面 -->
    <div id="overlay">
        <!-- 開始畫面 -->
        <div id="start-screen" style="text-align:center;">
            <h1 style="font-size:5vw; color:white; text-shadow:0 0 30px #00f3ff; margin-bottom:10px;">霓虹全能對戰王</h1>
            <p style="font-size:1.5vw; color:#aaa;">P1: WASD | P2: 方向鍵</p>
            <p style="color:#ffcc00;">包含運算、圖形判斷、生存搶答題！</p>
            <button onclick="startGame()">開始遊戲 (60秒)</button>
        </div>

        <!-- 結束畫面 -->
        <div id="end-screen" class="result-container" style="display:none;">
            <!-- P1 結果 -->
            <div class="result-col result-p1">
                <h2>P1 藍隊</h2>
                <div class="big-score" id="end-p1-score">0</div>
                <div id="p1-win-msg" style="display:none; color:#00f3ff; font-weight:bold; font-size:2vw;">WINNER</div>
            </div>

            <!-- 排行榜 -->
            <div class="result-col result-center">
                <h2>TOP 10 排行榜</h2>
                <div class="leaderboard-list" id="lb-list">
                    <!-- JS 生成 -->
                </div>
                
                <div id="winner-input-section">
                    <p style="margin:5px;">恭喜獲勝！輸入名字：</p>
                    <input type="text" id="winner-name" maxlength="5" placeholder="AAA">
                    <button onclick="submitScore()">儲存並重玩</button>
                </div>
                <div id="replay-btn-section" style="display:none; text-align:center;">
                    <button onclick="location.reload()">再玩一次</button>
                </div>
            </div>

            <!-- P2 結果 -->
            <div class="result-col result-p2">
                <h2>P2 紅隊</h2>
                <div class="big-score" id="end-p2-score">0</div>
                <div id="p2-win-msg" style="display:none; color:#ff0055; font-weight:bold; font-size:2vw;">WINNER</div>
            </div>
        </div>
    </div>

    <script>
        // --- 初始化 & 設定 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiElements = {
            timer: document.getElementById('timer-box'),
            qText: document.getElementById('question-text'),
            p1Score: document.getElementById('p1-score'),
            p2Score: document.getElementById('p2-score'),
            survivalCnt: document.getElementById('survival-countdown'),
            overlay: document.getElementById('overlay'),
            startScreen: document.getElementById('start-screen'),
            endScreen: document.getElementById('end-screen'),
            endP1: document.getElementById('end-p1-score'),
            endP2: document.getElementById('end-p2-score'),
            inputSection: document.getElementById('winner-input-section'),
            winnerInput: document.getElementById('winner-name'),
            replaySection: document.getElementById('replay-btn-section'),
            lbList: document.getElementById('lb-list')
        };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 遊戲變數
        let gameState = 'start'; // start, playing, end
        let gameTime = 60;
        let timerInterval;
        let shakeFrames = 0;
        let currentMode = 'bumper'; // 'bumper' (撞球) 或 'survival' (搶地盤)
        let survivalTimer = 0; // 生存模式倒數
        let survivalMaxTime = 3; // 3秒
        
        // 玩家資料
        const players = {
            p1: { x: 0, y: 0, r: 25, color: '#00f3ff', score: 0, vx: 0, vy: 0, keys: {u:'w', d:'s', l:'a', r:'d'} },
            p2: { x: 0, y: 0, r: 25, color: '#ff0055', score: 0, vx: 0, vy: 0, keys: {u:'ArrowUp', d:'ArrowDown', l:'ArrowLeft', r:'ArrowRight'} }
        };
        const keysPressed = {};
        window.addEventListener('keydown', (e) => keysPressed[e.key] = true);
        window.addEventListener('keyup', (e) => keysPressed[e.key] = false);

        // 物件池
        let targets = []; // 可能是球 (bumper) 或 區域 (survival)
        let particles = [];
        let currentQData = {};

        // --- 題目生成系統 ---
        // 這裡定義題目類型，包含運算、邏輯、圖形
        function generateQuestion() {
            // 隨機決定模式：30% 機率是生存模式 (圖形/判斷)，70% 是撞球運算
            const isSurvival = Math.random() < 0.3;
            currentMode = isSurvival ? 'survival' : 'bumper';

            // 清空舊目標
            targets = [];

            if (currentMode === 'bumper') {
                // --- 撞球模式題目 ---
                const type = Math.random();
                let qStr = "", ans = 0;
                
                if (type < 0.4) { // 加減乘
                    const op = ['+', '-', 'x'][Math.floor(Math.random()*3)];
                    let a = Math.floor(Math.random()*12)+1;
                    let b = Math.floor(Math.random()*12)+1;
                    if(op === '-') a += b; // 確保正數
                    qStr = `${a} ${op === 'x' ? '×' : op} ${b} = ?`;
                    ans = (op==='+') ? a+b : (op=='-') ? a-b : a*b;
                } else if (type < 0.7) { // 數列
                    let start = Math.floor(Math.random()*5)+1;
                    let diff = Math.floor(Math.random()*4)+2;
                    qStr = `${start}, ${start+diff}, ${start+diff*2}, ?`;
                    ans = start+diff*3;
                } else { // 因數/倍數 (簡化顯示)
                    let base = Math.floor(Math.random()*5)+3;
                    let isMultiple = Math.random() < 0.5;
                    if (isMultiple) {
                        qStr = `找出 ${base} 的倍數`;
                        ans = base * (Math.floor(Math.random()*3)+2);
                    } else {
                        // 因數 (找能整除的)
                        ans = base; // 答案是 base
                        let bigNum = base * (Math.floor(Math.random()*3)+2);
                        qStr = `找出 ${bigNum} 的因數`;
                    }
                }
                
                uiElements.qText.innerText = qStr;
                spawnBumperBalls(ans);

            } else {
                // --- 生存模式題目 (幾何/判斷) ---
                // 在這模式下，Target 不是球，而是地上的光圈
                let qType = Math.floor(Math.random() * 3); // 0:角度, 1:比較, 2:IQ
                let qStr = "";
                let options = []; // { type: 'text'/'shape', val: ... , isCorrect: bool }

                if (qType === 0) {
                    qStr = "快！停在「直角」上！";
                    options = [
                        { type: 'angle', val: 90, isCorrect: true },
                        { type: 'angle', val: 45, isCorrect: false },
                        { type: 'angle', val: 135, isCorrect: false }
                    ];
                } else if (qType === 1) {
                    qStr = "哪個是「鈍角三角形」？";
                     options = [
                        { type: 'tri', val: 'obtuse', isCorrect: true }, // 鈍角
                        { type: 'tri', val: 'acute', isCorrect: false }, // 銳角
                        { type: 'tri', val: 'right', isCorrect: false }  // 直角
                    ];
                } else {
                    qStr = "找出最大的數字！";
                    let v1 = Math.floor(Math.random()*50);
                    let v2 = Math.floor(Math.random()*50);
                    let v3 = Math.floor(Math.random()*50) + 100; // 最大
                    options = [
                        { type: 'text', val: v1, isCorrect: false },
                        { type: 'text', val: v2, isCorrect: false },
                        { type: 'text', val: v3, isCorrect: true }
                    ];
                }

                uiElements.qText.innerText = qStr;
                startSurvivalRound(options);
            }
        }

        function spawnBumperBalls(correctVal) {
            // 生成 5 顆球，物理碰撞
            let answers = [correctVal];
            while(answers.length < 5) {
                let w = correctVal + Math.floor(Math.random()*20)-10;
                if(w !== correctVal && w > 0 && !answers.includes(w)) answers.push(w);
            }
            answers.sort(() => Math.random() - 0.5);

            answers.forEach(val => {
                targets.push({
                    x: Math.random() * (canvas.width - 200) + 100,
                    y: Math.random() * (canvas.height - 300) + 200,
                    r: 35,
                    val: val,
                    isCorrect: val === correctVal,
                    vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3,
                    type: 'ball'
                });
            });
        }

        function startSurvivalRound(options) {
            // 生成 2-3 個固定區域 (Zone)
            options = options.sort(() => Math.random() - 0.5); // 打亂位置
            
            // 根據螢幕寬度分佈
            const step = canvas.width / (options.length + 1);
            
            options.forEach((opt, idx) => {
                targets.push({
                    x: step * (idx + 1),
                    y: canvas.height * 0.6,
                    r: 120, // 初始半徑大
                    maxR: 120,
                    val: opt.val,
                    drawType: opt.type, // angle, tri, text
                    isCorrect: opt.isCorrect,
                    vx: 0, vy: 0,
                    type: 'zone'
                });
            });

            // 開始倒數邏輯
            survivalTimer = survivalMaxTime;
            uiElements.survivalCnt.style.display = 'block';
            uiElements.survivalCnt.innerText = "3";
        }

        // --- 遊戲邏輯 ---
        function startGame() {
            players.p1.score = 0; players.p2.score = 0;
            players.p1.x = canvas.width*0.2; players.p1.y = canvas.height/2;
            players.p2.x = canvas.width*0.8; players.p2.y = canvas.height/2;
            
            gameTime = 60;
            gameState = 'playing';
            
            uiElements.startScreen.style.display = 'none';
            uiElements.endScreen.style.display = 'none';
            uiElements.overlay.style.display = 'none';
            updateScoreUI();

            timerInterval = setInterval(() => {
                gameTime--;
                uiElements.timer.innerText = gameTime;
                if(gameTime <= 10) uiElements.timer.classList.add('timer-warning');
                else uiElements.timer.classList.remove('timer-warning');

                if(gameTime <= 0) endGame();
            }, 1000);

            generateQuestion();
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            clearInterval(timerInterval);
            gameState = 'end';
            uiElements.overlay.style.display = 'flex';
            uiElements.startScreen.style.display = 'none';
            uiElements.endScreen.style.display = 'flex';
            uiElements.survivalCnt.style.display = 'none';

            // 更新結算分數
            uiElements.endP1.innerText = players.p1.score;
            uiElements.endP2.innerText = players.p2.score;

            // 判斷贏家
            let winner = null;
            document.getElementById('p1-win-msg').style.display = 'none';
            document.getElementById('p2-win-msg').style.display = 'none';
            
            if (players.p1.score > players.p2.score) {
                winner = 'P1';
                document.getElementById('p1-win-msg').style.display = 'block';
            } else if (players.p2.score > players.p1.score) {
                winner = 'P2';
                document.getElementById('p2-win-msg').style.display = 'block';
            }

            renderLeaderboard();

            if (winner) {
                uiElements.inputSection.style.display = 'block';
                uiElements.replaySection.style.display = 'none';
                window.winningScore = Math.max(players.p1.score, players.p2.score);
            } else {
                uiElements.inputSection.style.display = 'none';
                uiElements.replaySection.style.display = 'block';
            }
        }

        function updatePlayer(p) {
            const speed = 1.0;
            const friction = 0.92;
            if (keysPressed[p.keys.u]) p.vy -= speed;
            if (keysPressed[p.keys.d]) p.vy += speed;
            if (keysPressed[p.keys.l]) p.vx -= speed;
            if (keysPressed[p.keys.r]) p.vx += speed;

            p.vx *= friction; p.vy *= friction;
            p.x += p.vx; p.y += p.vy;

            // 邊界
            if (p.x < p.r) { p.x = p.r; p.vx *= -0.5; }
            if (p.x > canvas.width-p.r) { p.x = canvas.width-p.r; p.vx *= -0.5; }
            if (p.y < p.r+100) { p.y = p.r+100; p.vy *= -0.5; }
            if (p.y > canvas.height-p.r) { p.y = canvas.height-p.r; p.vy *= -0.5; }
        }

        function updateGame() {
            if (currentMode === 'survival') {
                // 生存模式：處理倒數與縮圈
                survivalTimer -= 1/60; // 假設 60fps
                let displaySec = Math.ceil(survivalTimer);
                if (displaySec > 0) uiElements.survivalCnt.innerText = displaySec;

                // 縮圈效果
                targets.forEach(t => {
                    if (t.type === 'zone') {
                        // 3秒內縮小到 50%
                        let progress = Math.max(0, survivalTimer / survivalMaxTime);
                        t.r = t.maxR * (0.5 + 0.5 * progress); 
                    }
                });

                if (survivalTimer <= 0) {
                    // 時間到！結算位置
                    uiElements.survivalCnt.style.display = 'none';
                    checkSurvivalResult();
                    shakeScreen(15);
                    generateQuestion(); // 下一題
                }
            }
        }

        function checkSurvivalResult() {
            // 檢查誰在正確圈內
            [players.p1, players.p2].forEach(p => {
                let safe = false;
                targets.forEach(t => {
                    if (t.isCorrect) {
                        let dist = Math.hypot(p.x - t.x, p.y - t.y);
                        if (dist < t.r) safe = true;
                    }
                });

                if (safe) {
                    p.score += 5; // 生存題分數較高
                    createFloatingText(p.x, p.y, "+5", p.color);
                    createParticles(p.x, p.y, '#ffff00', 20);
                } else {
                    // 處罰被撞飛
                    p.vx = (Math.random()-0.5)*30;
                    p.vy = (Math.random()-0.5)*30;
                    createFloatingText(p.x, p.y, "Miss!", "#fff");
                }
            });
            updateScoreUI();
        }

        function checkCollisions() {
            // P1 vs P2 (推擠)
            let dx = players.p2.x - players.p1.x;
            let dy = players.p2.y - players.p1.y;
            let dist = Math.hypot(dx, dy);
            if (dist < players.p1.r + players.p2.r) {
                // 物理彈開
                let angle = Math.atan2(dy, dx);
                let force = 1.0; 
                let pushX = Math.cos(angle) * force;
                let pushY = Math.sin(angle) * force;
                
                players.p1.vx -= pushX; players.p1.vy -= pushY;
                players.p2.vx += pushX; players.p2.vy += pushY;
                
                // 防止重疊
                let overlap = (players.p1.r + players.p2.r - dist) / 2;
                players.p1.x -= Math.cos(angle) * overlap;
                players.p1.y -= Math.sin(angle) * overlap;
                players.p2.x += Math.cos(angle) * overlap;
                players.p2.y += Math.sin(angle) * overlap;
            }

            // 僅在 Bumper 模式下檢測撞球
            if (currentMode === 'bumper') {
                [players.p1, players.p2].forEach(p => {
                    for (let i = targets.length - 1; i >= 0; i--) {
                        let t = targets[i];
                        if (t.type !== 'ball') continue;

                        let d = Math.hypot(p.x - t.x, p.y - t.y);
                        if (d < p.r + t.r) {
                            if (t.isCorrect) {
                                p.score += 2; // 普通題 2 分
                                updateScoreUI();
                                createParticles(t.x, t.y, '#00ff00', 30);
                                createFloatingText(t.x, t.y, "+2", p.color);
                                shakeScreen(10);
                                generateQuestion(); // 下一題
                                return;
                            } else {
                                p.score = Math.max(0, p.score - 1);
                                updateScoreUI();
                                createParticles(t.x, t.y, '#ff0000', 10);
                                createFloatingText(t.x, t.y, "-1", '#ff0000');
                                shakeScreen(5);
                                t.vx = (t.x - p.x) * 0.2;
                                t.vy = (t.y - p.y) * 0.2;
                            }
                        }
                    }
                });
            }
        }

        function updateScoreUI() {
            uiElements.p1Score.innerText = players.p1.score;
            uiElements.p2Score.innerText = players.p2.score;
        }

        // --- 繪圖系統 ---
        function draw() {
            let tx=0, ty=0;
            if(shakeFrames>0) { tx=(Math.random()-0.5)*10; ty=(Math.random()-0.5)*10; shakeFrames--; }
            ctx.save();
            ctx.translate(tx, ty);
            ctx.clearRect(0,0, canvas.width, canvas.height);

            // 背景網格
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth=1;
            for(let i=0; i<canvas.width; i+=100) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=100) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

            // 繪製目標 (球或區域)
            targets.forEach(t => {
                if (t.type === 'ball') {
                    // 撞球模式：移動
